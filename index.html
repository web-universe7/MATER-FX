<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master FX & SMC Concept Drive | ₹49</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; max-width: 440px; width: 100%; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 700; }
        h1 { font-size: 22px; margin: 16px 0 8px; color: #ffffff; }
        p.desc { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .price-box { background: #1e293b; padding: 14px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: baseline; gap: 10px; }
        .price-box .price { font-size: 32px; font-weight: 800; color: #10b981; }
        .price-box .old-price { text-decoration: line-through; color: #64748b; font-size: 15px; }
        ul { list-style: none; margin-bottom: 24px; }
        ul li { margin-bottom: 10px; font-size: 14px; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
        ul li::before { content: "✓"; color: #38bdf8; font-weight: bold; }
        .btn { width: 100%; background: #38bdf8; color: #0b0f19; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0284c7; color: #ffffff; }
    </style>
</head>
<body>

<div class="card">
    <span class="badge">INSTANT ACCESS</span>
    <h1>Master FX & SMC Strategy Vault</h1>
    <p class="desc">Institutional SMC order blocks, liquidity sweep setups, and master PDF resources.</p>
    
    <div class="price-box">
        <span class="price">₹49</span>
        <span class="old-price">₹999</span>
    </div>

    <ul>
        <li>Master FX Complete Folder Access</li>
        <li>SMC Liquidity & Order Block PDFs</li>
        <li>Instant Auto-Redirect after Payment</li>
        <li>Lifetime Updates Included</li>
    </ul>

    <button id="pay-btn" class="btn">Unlock Access for ₹49</button>
</div>

<script>
document.getElementById('pay-btn').onclick = async function() {
    const btn = this;
    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
        const res = await fetch('/create-order', { method: 'POST' });
        const { order } = await res.json();

        const options = {
            "key": "{{ rzp_key }}",
            "amount": order.amount,
            "currency": order.currency,
            "name": "Master FX Hub",
            "description": "SMC Concept Drive & PDF Bundle",
            "order_id": order.id,
            "handler": async function(response) {
                const verifyRes = await fetch('/verify-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(response)
                });
                const verifyData = await verifyRes.json();
                if (verifyData.status === 'success') {
                    window.location.href = '/success';
                } else {
                    alert('Payment verification failed.');
                }
            },
            "theme": { "color": "#38bdf8" }
        };

        const rzp = new Razorpay(options);
        rzp.open();
    } catch (err) {
        alert("Failed to initialize order. Please try again.");
    } finally {
        btn.disabled = false;
        btn.innerText = "Unlock Access for ₹49";
    }
};
</script>
</body>
</html>
